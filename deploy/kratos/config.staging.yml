dsn: postgres://serlo:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  public:
    base_url: https://kratos.serlo-staging.dev
    request_log:
      disable_for_health: true
  admin:
    request_log:
      disable_for_health: true

selfservice:
  default_browser_return_url: https://serlo-staging.dev/
  allowed_return_urls:
    # TODO: try with wildcard later
    - https://fr.serlo-staging.dev/
    - https://hi.serlo-staging.dev/
    - https://de.serlo-staging.dev/
    - https://ta.serlo-staging.dev/
    - https://en.serlo-staging.dev/
    - https://es.serlo-staging.dev/
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
    link:
      enabled: true
      config:
        base_url: https://serlo-staging.dev/api/.ory/
    oidc:
      enabled: true
      config:
        base_redirect_uri: https://serlo-staging.dev/api/.ory/
        providers:
          - id: nbp
            provider: generic
            client_id: ${nbp_client_id}
            client_secret: ${nbp_client_secret}
            issuer_url: https://aai.demo.meinbildungsraum.de/realms/nbp-aai
            mapper_url: file:///etc/config/kratos/user_mapper.jsonnet
          - id: vidis
            provider: generic
            client_id: ${vidis_client_id}
            client_secret: ${vidis_client_secret}
            issuer_url: ${vidis_issuer_url}
            mapper_url: file:///etc/config/kratos/vidis_user_mapper.jsonnet

  flows:
    error:
      ui_url: https://serlo-staging.dev/auth/error

    settings:
      ui_url: https://serlo-staging.dev/auth/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      use: link
      ui_url: https://serlo-staging.dev/auth/recovery

    verification:
      enabled: true
      use: link
      ui_url: https://serlo-staging.dev/auth/verification

    logout:
      after:
        default_browser_return_url: https://serlo-staging.dev/auth/login

    login:
      ui_url: https://serlo-staging.dev/auth/login
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: require_verified_address
            - hook: web_hook
              config:
                url: https://api.serlo-staging.dev/kratos/updateLastLogin
                method: POST
                body: file:///etc/config/kratos/identity_id.jsonnet
                response:
                  ignore: true
        oidc:
          default_browser_return_url: https://serlo-staging.dev/auth/login

    registration:
      enable_legacy_one_step: true
      lifespan: 10m
      ui_url: https://serlo-staging.dev/auth/registration
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://api.serlo-staging.dev/kratos/register
              method: POST
              body:  file:///etc/config/kratos/identity_id.jsonnet
              auth:
                type: api_key
                config:
                  name: x-kratos-key
                  value: ${kratos_secret}
                  in: header
          - hook: web_hook
            config:
              url: https://${mailchimp_server}.api.mailchimp.com/3.0/lists/a7bb2bbc4f/members
              method: POST
              body:  file:///etc/config/kratos/subscribe_newsletter_mapper.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: basic_auth
                config:
                  user: serlo
                  password: ${newsletter_api_key}
        oidc:
          default_browser_return_url: https://serlo-staging.dev/auth/login
          hooks:
            - hook: web_hook
              config:
                url: https://api.serlo-staging.dev/kratos/register
                method: POST
                body: file:///etc/config/kratos/identity_id.jsonnet
                auth:
                  type: api_key
                  config:
                    name: x-kratos-key
                    value: ${kratos_secret}
                    in: header
            - hook: session
            - hook: web_hook
              config:
                url: https://${mailchimp_server}.api.mailchimp.com/3.0/lists/a7bb2bbc4f/members
                method: POST
                body: file:///etc/config/kratos/subscribe_newsletter_mapper.jsonnet
                can_interrupt: false
                response:
                  ignore: true
                auth:
                  type: basic_auth
                  config:
                    user: serlo
                    password: ${newsletter_api_key}

session:
  lifespan: 720h

secrets:
  cookie:
    - ${cookie_secret}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://SMTP_Injection:${smtp_password}@smtp.eu.sparkpostmail.com:2525
    from_name: Serlo
    from_address: no-reply@mail.serlo.org
  templates:
    verification:
      valid:
        email:
          subject: http://serlo-staging.dev/api/.ory/mail-templates/verification/valid/email.subject.gotmpl
          body:
            html: http://serlo-staging.dev/api/.ory/mail-templates/verification/valid/email.body.gotmpl
            plaintext: http://serlo-staging.dev/api/.ory/mail-templates/verification/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: http://serlo-staging.dev/api/.ory/mail-templates/verification/invalid/email.subject.gotmpl
          body:
            html: http://serlo-staging.dev/api/.ory/mail-templates/verification/invalid/email.body.gotmpl
            plaintext: http://serlo-staging.dev/api/.ory/mail-templates/verification/invalid/email.body.plaintext.gotmpl
    recovery:
      valid:
        email:
          subject: http://serlo-staging.dev/api/.ory/mail-templates/recovery/valid/email.subject.gotmpl
          body:
            html: http://serlo-staging.dev/api/.ory/mail-templates/recovery/valid/email.body.gotmpl
            plaintext: http://serlo-staging.dev/api/.ory/mail-templates/recovery/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: http://serlo-staging.dev/api/.ory/mail-templates/recovery/invalid/email.subject.gotmpl
          body:
            html: http://serlo-staging.dev/api/.ory/mail-templates/recovery/invalid/email.body.gotmpl
            plaintext: http://serlo-staging.dev/api/.ory/mail-templates/recovery/invalid/email.body.plaintext.gotmpl
